version: "3"

services:
  db:
    container_name: totem-backend-db
    image: postgres:14.7
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    # Each statement prefixed with its database (%d) and the container that
    # sent it (%a: `application_name`, see POSTGRES_APP_NAME).
    command: ["postgres", "-c", "log_statement=all", "-c", "log_line_prefix=%m [%p] %u@%d %a "]
    networks:
      - totem-backend-network

  django:
    container_name: totem-backend
    build:
      context: .
    command: "uvicorn totem.asgi:application --port 8000 --host 0.0.0.0 --reload --log-level warning"
    entrypoint: "docker-entrypoint-local.sh"
    volumes:
      - ./src:/usr/src/app
      - totem-static:/usr/src/static
      - totem-media:/usr/src/media
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_APP_NAME=totem-backend
    env_file:
      - default.env
    tty: true
    stdin_open: true
    depends_on:
      - db
      - redis
    networks:
      - totem-backend-network
      - totem-saas-network

  redis:
    container_name: totem-backend-redis
    image: redis:7-alpine
    networks:
      - totem-backend-network

  worker:
    container_name: totem-backend-worker
    build:
      context: .
    # The `django` service runs the migrations: no preflight here, to not
    # migrate concurrently.
    entrypoint: ""
    command: ["celery", "-A", "totem", "worker", "--loglevel", "info", "--concurrency", "4"]
    restart: unless-stopped
    volumes:
      - ./src:/usr/src/app
      - totem-media:/usr/src/media
    environment:
      - POSTGRES_APP_NAME=totem-backend-worker
    env_file:
      - default.env
    depends_on:
      - db
      - redis
    networks:
      - totem-backend-network

  # Exactly one beat: each beat instance sends the due tasks, so two of them
  # would run every periodic task twice.
  beat:
    container_name: totem-backend-beat
    build:
      context: .
    entrypoint: ""
    command: ["celery", "-A", "totem", "beat", "--loglevel", "info"]
    # Restarts until the `django` service has run the migrations of the
    # schedule tables.
    restart: unless-stopped
    volumes:
      - ./src:/usr/src/app
    environment:
      - POSTGRES_APP_NAME=totem-backend-beat
    env_file:
      - default.env
    depends_on:
      - db
      - redis
    networks:
      - totem-backend-network

  nginx:
    container_name: totem-backend-nginx
    image: nginx
    depends_on:
      - django
    ports:
      - "8080:80"
    volumes:
      - totem-static:/usr/src/static
      - totem-media:/usr/src/media
      # A template: the image fills in `${POSTGRES_NAME}` when it starts.
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template
    environment:
      - POSTGRES_NAME=postgres
      # Render into /etc/nginx/nginx.conf, and substitute that variable only:
      # the nginx `$variables` of the template must stay as they are.
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
      - NGINX_ENVSUBST_FILTER=^POSTGRES_NAME$
    networks:
      - totem-backend-network
      - totem-saas-network

volumes:
  db-data:
  totem-static:
  totem-media:

networks:
  totem-backend-network:
    name: totem-backend-network
  totem-saas-network:
    name: totem-saas-network
    external: true
